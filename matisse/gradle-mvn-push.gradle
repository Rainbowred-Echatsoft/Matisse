apply plugin: "maven-publish"
apply plugin: 'signing'

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = GROUP
                artifactId = POM_ARTIFACT_ID
                version = MATISSE_VERSION_NAME

                pom {
                    name = "echatsdk - matisse"
                    description = "用于Android Support依赖下的一洽SDK Matiesse模块"
                    url = 'https://www.echatsoft.com'
                    // 许可证名称和地址
                    licenses {
                        license {
                            name = 'The Apache License, Version 2.0'
                            url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                        }
                    }
                    developers {
                        developer {
                            id  = "XHY"
                            name = "Haoyang Xu"
                            email = "xuhaoyang3x@gmail.com"
                        }
                    }
                    // 版本控制仓库地址
                    scm {
                        url = 'https://github.com/Rainbowred-Echatsoft/Matisse'
                        connection = 'scm:git@github.com:Rainbowred-Echatsoft/Matisse.git'
                        developerConnection = 'scm:git:ssh://git@github.com:Rainbowred-Echatsoft/Matisse.git'
                    }
                }
            }
        }
        repositories {
            maven {
                name("rainbowred")
                url = "https://nexus.rainbowred.com/repository/sdk/"
                credentials {
                    username = nexus_user
                    password = nexus_password
                }
            }
            maven{
                name("mavenCentral")
                url = uri('file:///Users/xuhaoyang/echat/repo/mavenCentral/')
            }
        }
    }
}

//签名
signing {
    sign publishing.publications
}